name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest 已是 26.04，setup-python 不再提供 3.9；锁 22.04
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python mcrescue.py --help
          python mcrescue.py where "63 58 45"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check mcrescue.py tests
